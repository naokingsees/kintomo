<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E11D2A">
<meta name="description" content="開くのが楽しい。見た瞬間にやる気が出る筋トレ記録アプリ。">
<title>きんトモ|筋トレの記録と応援</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="きんトモ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  // 画面がちらつかないよう、最初に明るい/暗いテーマを決める
  (function () {
    var t = null;
    try { t = localStorage.getItem('kintomo.theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>
  <main id="app" class="app"></main>
  <div id="layer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
  <script src="app.js"></script>
  <script>
    // オフラインでも開けるようにする(対応ブラウザのみ)
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* 失敗してもアプリは動く */ });
      });
    }
  </script>
</body>
</html>
